name: CI/CD

# PR: lint・ビルド（事前描画を含む）・型チェック
# main への push: 上記が通ったら Cloudflare Workers（mitsukabose-inbound）へデプロイ
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:vinext
      # .cloudflare/types（Workers の型）はビルドで生成されるので、型チェックはビルドの後
      - run: npx tsc --noEmit

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 96dc0d345a3061736d1f32cd12135662
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ビルド（事前描画を含む）とデプロイを行う。シークレットとバインディングは Worker 側に登録済み
      - run: npx vinext-cloudflare deploy
